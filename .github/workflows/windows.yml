name: Windows C# build
on:
  push:
    paths: ['Windows/**', 'StoreBridge/SteamBridge/**', 'StoreBridge/dependencies.lock.json', 'Synthetic/*Steam*Checks.cs', 'Scripts/steamkit_websocket_close*', 'Scripts/steam_depot_progress*', 'sources.lock.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['Windows/**', 'StoreBridge/SteamBridge/**', 'StoreBridge/dependencies.lock.json', 'Synthetic/*Steam*Checks.cs', 'Scripts/steamkit_websocket_close*', 'Scripts/steam_depot_progress*', 'sources.lock.json', '.github/workflows/windows.yml']
jobs:
  native-build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native C# frontend, core checks and source-built Steam service
        shell: pwsh
        run: ./Windows/Scripts/Build-Windows.ps1 -Runtime ${{ matrix.runtime }}
      # Hosted runners have no certified Vulkan GPU; hardware readbacks are run
      # on the owned Windows PC and are recorded separately in Validation/.
